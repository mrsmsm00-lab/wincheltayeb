# بيتأكد إن الموقع بيعمل build من غير أخطاء مع كل push
name: web-build
on:
  push: { paths: ["wincheltayeb/web/**"] }
  pull_request: { paths: ["wincheltayeb/web/**"] }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: wincheltayeb/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: wincheltayeb/web/package-lock.json }
      - run: npm ci
      - run: npm run build
